<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회상시험 | 本草 LAB</title><link rel="stylesheet" href="styles.css"></head><body><div id="nav"></div><main class="wrap"><section class="section-title"><div><div class="eyebrow">FREE RECALL</div><h2>회상시험</h2></div><span class="small">보기 없는 자유회상</span></section><div class="card recall-box"><div class="recall-select"><select id="sub" class="btn" style="flex:1"></select><button class="btn" id="random">랜덤</button></div><h3 id="prompt" style="font-size:28px;margin-bottom:6px"></h3><p class="small" id="meta"></p><textarea id="answer" placeholder="기억나는 약재를 쉼표, 줄바꿈 또는 띄어쓰기로 입력하세요. 한자 없이 한글 약재명만 써도 됩니다."></textarea><div class="toolbar"><button class="btn primary" id="grade">채점하기</button><button class="btn" id="clear">다시 쓰기</button></div><div id="result"></div></div><div id="mobile"></div></main><script src="data.js"></script><script src="common.js"></script><script>
document.getElementById('nav').innerHTML=nav('recall');document.getElementById('mobile').innerHTML=mobileNav();let leaves=scopeLeaves();if(!leaves.length)leaves=flattenSubcategories();const sel=document.getElementById('sub');sel.innerHTML=leaves.map((s,i)=>`<option value="${i}">${s.name} (${s.ko})</option>`).join('');function current(){return leaves[+sel.value||0]}function draw(){const s=current();document.getElementById('prompt').textContent=s.name;document.getElementById('prompt').style.color=s.color;document.getElementById('meta').textContent=`${s.group} → ${s.category} · ${s.herbs.length}개 약재`;document.getElementById('result').innerHTML=''}sel.onchange=draw;document.getElementById('random').onclick=()=>{sel.value=Math.floor(Math.random()*leaves.length);draw()};document.getElementById('clear').onclick=()=>{document.getElementById('answer').value='';document.getElementById('result').innerHTML=''};
document.getElementById('grade').onclick=()=>{const s=current();const raw=document.getElementById('answer').value.trim();const tokens=raw.split(/[\n,、/\s]+/).map(x=>x.trim()).filter(Boolean);const answers=new Set(tokens);const targets=s.herbs.map(plainHerb);const hit=targets.filter(x=>answers.has(x));const miss=targets.filter(x=>!answers.has(x));const extra=[...answers].filter(x=>!targets.includes(x));recordRecall(hit.length,targets.length);const ratio=targets.length?hit.length/targets.length:0;addProgress(s.name,Math.round(ratio*12));miss.forEach(x=>{const full=s.herbs.find(h=>plainHerb(h)===x);if(full)addMistake(full)});document.getElementById('result').innerHTML=`<div class="result-grid"><div><strong>기억함 ${hit.length}/${targets.length}</strong><div class="tag-wrap" style="margin-top:8px">${hit.map(x=>`<span class="tag hit">${x}</span>`).join('')||'<span class="small">없음</span>'}</div></div><div><strong>놓침 ${miss.length}</strong><div class="tag-wrap" style="margin-top:8px">${miss.map(x=>`<span class="tag miss">${x}</span>`).join('')||'<span class="small">없음</span>'}</div>${extra.length?`<p class="small">범위 밖 입력: ${extra.join(', ')}</p>`:''}</div></div>`};draw();
</script></body></html>
