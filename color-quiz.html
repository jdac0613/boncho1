<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>색칠퀴즈 | 본초학 익히기</title><link rel="stylesheet" href="styles.css"></head><body><div id="nav"></div><main class="wrap"><section class="section-title"><div><div class="eyebrow">COLOR POND</div><h2>색칠퀴즈</h2></div><button class="btn" id="new">새 보드</button></section><div class="notice">대목차마다 하나의 풍경 팔레트를 사용합니다. 소목차의 시그니처 색을 고른 뒤 약재 연잎을 눌러 채워보세요. <strong>한 번 맞힌 약재는 그 색으로 고정되고 다시 선택되지 않습니다.</strong></div><div class="color-theme-banner" id="themeBanner"><div><span class="small">현재 풍경</span><div class="theme-name" id="themeName"></div><span class="theme-desc" id="themeDesc"></span></div><div class="theme-dots" id="themeDots"></div></div><div class="gem-shell"><div class="gem-toolbar"><div><div class="small">현재 선택</div><div class="current-paint" id="currentPaint"></div></div><div class="gem-score-wrap"><strong id="score">0 / 0</strong><div class="gem-progress"><span id="gemProgress"></span></div></div></div><div class="gem-legend" id="legend"></div><div class="gem-board-wrap" id="boardWrap"><div class="gem-board" id="mosaic"></div></div><div class="small gem-help">Tip. 같은 대목차의 색들은 하나의 풍경처럼 이어집니다. 바다빛, 노을빛, 새벽빛 자체를 분류의 기억 단서로 써보세요.</div></div><div id="mobile"></div></main><script src="data.js"></script><script src="common.js"></script><script>
document.getElementById('nav').innerHTML=nav('color-quiz');document.getElementById('mobile').innerHTML=mobileNav();
const BOARD_KEY='herbColorBoardV2';
const THEMES={
'解表藥':{name:'맑은 아침 하늘',desc:'바람이 열리듯 산뜻한 하늘빛과 살구빛',a:'#CDEAF3',b:'#F8DDC7'},
'淸熱藥':{name:'맑은 여름 바다',desc:'열을 식혀주는 아쿠아, 민트, 라벤더빛',a:'#CBEAF4',b:'#D7EEE5'},
'瀉下藥':{name:'노을진 들판',desc:'아래로 내려앉는 듯한 피치, 로즈, 보랏빛 노을',a:'#F3D2B7',b:'#E9CEDB'},
'祛風濕藥':{name:'비 갠 숲',desc:'젖은 잎과 이끼가 맑아지는 세이지 숲빛',a:'#D2E6D8',b:'#DEE8C4'},
'方香化濕藥':{name:'허브 정원',desc:'향긋하고 가벼운 어린잎의 연두빛',a:'#DDECCB',b:'#EFF5DE'},
'利水滲濕藥':{name:'비 온 뒤 연못',desc:'물이 흘러가는 듯한 옅은 청록과 물빛',a:'#D1EDF3',b:'#D8EEF0'},
'溫裏藥':{name:'따뜻한 저녁 등불',desc:'속을 데우는 부드러운 살구와 앰버빛',a:'#F7D2BE',b:'#F8E4C7'},
'理氣藥':{name:'봄바람',desc:'막힘 없이 흐르는 라일락과 연하늘빛',a:'#E4DDF2',b:'#DDEEF0'},
'消食藥':{name:'복숭아빛 오후',desc:'가볍고 포근한 피치와 크림빛',a:'#F7E0BE',b:'#FAE8D3'},
'驅蟲藥':{name:'신비로운 밤숲',desc:'깊지만 무겁지 않은 청보라 밤빛',a:'#D9DDF1',b:'#D4E4DC'},
'止血藥':{name:'붉은 꽃밭',desc:'말린 장미와 산호빛이 차분하게 번지는 풍경',a:'#F0D2D7',b:'#F3DDD3'},
'活血祛瘀藥':{name:'붉은 석양',desc:'정체된 혈이 다시 흐르는 듯한 코랄 석양빛',a:'#F3C9D2',b:'#F6D8C9'},
'化痰止咳平喘藥':{name:'안개 낀 호수',desc:'호흡처럼 옅게 번지는 회청, 민트, 연녹빛',a:'#DFE8EF',b:'#DBECE7'},
'安神藥':{name:'달빛 밤하늘',desc:'잠들기 전처럼 고요한 라벤더 달빛',a:'#E1DFF1',b:'#E8EAF6'},
'平肝藥':{name:'새벽하늘',desc:'푸른 회색에서 연보라로 밝아지는 새벽빛',a:'#DCE3EF',b:'#E9DCE8'},
'開竅藥':{name:'새벽빛',desc:'막힌 감각이 열리듯 맑고 밝은 아이스블루',a:'#E2EFF4',b:'#F5F0D8'},
'補益藥':{name:'봄날 연꽃정원',desc:'채우고 길러주는 크림, 피치, 연꽃핑크, 연못빛',a:'#F4E8C8',b:'#E6EEDC'},
'收澁藥':{name:'잔잔한 가을',desc:'거두어들이는 베이지, 올리브, 말린 꽃빛',a:'#E7E0D0',b:'#DFE7DA'},
'涌吐藥':{name:'비 오기 직전 하늘',desc:'힘이 모이는 듯한 흐린 보라와 청회색',a:'#DFDDEA',b:'#D9E2E6'},
'外用藥':{name:'광물 정원',desc:'돌과 광물처럼 담백한 샌드, 세이지그레이',a:'#E5E8E4',b:'#EDE9DF'}
};
let leaves=scopeLeaves();if(!leaves.length)leaves=flattenSubcategories();let selected=leaves[0],tiles=[],correct=0,attempted=0;const legend=document.getElementById('legend'),mosaic=document.getElementById('mosaic'),paintBox=document.getElementById('currentPaint'),boardWrap=document.getElementById('boardWrap');
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function themeFor(s){return THEMES[s.category]||{name:'연못 팔레트',desc:'부드러운 파스텔 색으로 기억해보세요.',a:'#DDEEDF',b:'#EEF7EF'}}
function saveBoard(){localStorage.setItem(BOARD_KEY,JSON.stringify({scope:leaves.map(s=>s.name),tiles:tiles.map(t=>({h:t.h,sub:t.s.name,done:!!t.done})),attempted}))}
function loadBoard(){try{const x=JSON.parse(localStorage.getItem(BOARD_KEY)||'null');if(!x||!Array.isArray(x.tiles)||!Array.isArray(x.scope))return false;const now=leaves.map(s=>s.name);if(x.scope.length!==now.length||!x.scope.every(n=>now.includes(n)))return false;const map=new Map(leaves.map(s=>[s.name,s]));const restored=x.tiles.map(t=>({h:t.h,s:map.get(t.sub),done:!!t.done})).filter(t=>t.s&&t.s.herbs.includes(t.h));if(!restored.length)return false;tiles=restored;attempted=Number.isFinite(x.attempted)?x.attempted:0;correct=tiles.filter(t=>t.done).length;return true}catch(e){return false}}
function newBoard(){const pool=[];leaves.forEach(s=>s.herbs.forEach(h=>pool.push({h,s,done:false})));shuffle(pool);tiles=pool.slice(0,Math.min(30,pool.length));correct=0;attempted=0;saveBoard();render()}
function updateTheme(){const t=themeFor(selected);document.getElementById('themeName').textContent=`${selected.categoryKo} · ${t.name}`;document.getElementById('themeDesc').textContent=t.desc;const banner=document.getElementById('themeBanner');banner.style.setProperty('--theme-a',t.a);banner.style.setProperty('--theme-b',t.b);boardWrap.style.setProperty('--theme-a',t.a);boardWrap.style.setProperty('--theme-b',t.b);const related=flattenSubcategories().filter(x=>x.category===selected.category);document.getElementById('themeDots').innerHTML=related.map(x=>`<i style="--dot:${x.color}" title="${x.ko}"></i>`).join('')}
function updateTop(){paintBox.innerHTML=`<span class="paint-gem" style="--gem:${selected.color}"></span><span><b>${selected.ko}</b><small>${selected.name}</small></span>`;document.getElementById('score').textContent=`${correct} 완성 / ${tiles.length-correct} 남음 · ${attempted} 시도`;document.getElementById('gemProgress').style.width=`${tiles.length?Math.round(correct/tiles.length*100):0}%`;updateTheme()}
function renderLegend(){const byCat=new Map();leaves.forEach(s=>{if(!byCat.has(s.category))byCat.set(s.category,[]);byCat.get(s.category).push(s)});legend.innerHTML=[...byCat.entries()].map(([cat,subs])=>{const t=themeFor(subs[0]);return `<section class="palette-group" style="--theme-a:${t.a};--theme-b:${t.b}"><div class="palette-group-head"><strong>${subs[0].categoryKo}</strong><span>${t.name}</span></div><div class="palette-buttons">${subs.map(s=>{const i=leaves.indexOf(s);return `<button class="gem-legend-btn ${selected.name===s.name?'selected':''}" style="--gem:${s.color}" data-i="${i}" title="${s.name}"><span class="legend-gem" style="--gem:${s.color}"></span><span>${s.ko}</span></button>`}).join('')}</div></section>`}).join('');legend.querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=leaves[+b.dataset.i];renderLegend();updateTop()})}
function render(){renderLegend();mosaic.innerHTML='';tiles.forEach((t,i)=>{const d=document.createElement('button');d.className=`gem-tile${t.done?' filled':''}`;d.type='button';d.innerHTML=`<span class="gem-label">${plainHerb(t.h)}</span>`;d.dataset.i=i;if(t.done){d.disabled=true;d.dataset.done='1';d.style.setProperty('--gem',t.s.color);d.title=`완료 · ${t.s.ko} · ${t.s.name}`;d.setAttribute('aria-label',`${plainHerb(t.h)} 완료, ${t.s.ko}`)}else{d.setAttribute('aria-label',`${plainHerb(t.h)} 분류 선택`);d.onclick=()=>paint(d,t)}mosaic.appendChild(d)});updateTop();if(correct===tiles.length)mosaic.classList.add('complete')}
function paint(el,t){if(t.done)return;attempted++;const ok=selected.name===t.s.name;recordColor(ok);if(ok){correct++;t.done=true;el.dataset.done='1';el.disabled=true;el.classList.add('filled');el.style.setProperty('--gem',t.s.color);el.title=`완료 · ${t.s.ko} · ${t.s.name}`;el.setAttribute('aria-label',`${plainHerb(t.h)} 완료, ${t.s.ko}`);addProgress(t.s.name,2);saveBoard()}else{el.classList.remove('wrong');void el.offsetWidth;el.classList.add('wrong');addMistake(t.h);saveBoard();setTimeout(()=>el.classList.remove('wrong'),520)}updateTop();if(correct===tiles.length)setTimeout(()=>mosaic.classList.add('complete'),80)}
document.getElementById('new').onclick=()=>{mosaic.classList.remove('complete');localStorage.removeItem(BOARD_KEY);newBoard()};if(loadBoard())render();else newBoard();
</script></body></html>
