<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>내 기록 | 本草 LAB</title><link rel="stylesheet" href="styles.css"></head><body><div id="nav"></div><main class="wrap"><section class="section-title"><div><div class="eyebrow">MY RECORD</div><h2>내 기록</h2></div><button class="btn" id="reset">기록 초기화</button></section><div class="record-grid"><div class="card"><div class="small">전체 숙련도</div><div class="stat" id="avg"></div></div><div class="card"><div class="small">색칠퀴즈 정답률</div><div class="stat" id="color"></div></div><div class="card"><div class="small">회상시험 누적 회상률</div><div class="stat" id="recall"></div></div></div><section class="section-title"><h2>소목차 숙련도</h2><span class="small">진할수록 많이 익힌 범위</span></section><div class="card record-list" id="list"></div><section class="section-title"><h2>자주 틀린 약재</h2></section><div class="card" id="mistakes"></div><div id="mobile"></div></main><script src="data.js"></script><script src="common.js"></script><script>
document.getElementById('nav').innerHTML=nav('records');document.getElementById('mobile').innerHTML=mobileNav();function render(){const s=getStats(),p=getProgress(),m=getMistakes();document.getElementById('avg').textContent=avgProgress()+'%';document.getElementById('color').textContent=s.color.total?Math.round(s.color.correct/s.color.total*100)+'%':'—';document.getElementById('recall').textContent=s.recall.total?Math.round(s.recall.correct/s.recall.total*100)+'%':'—';document.getElementById('list').innerHTML=flattenSubcategories().map(x=>{const v=p[x.name]||0;return `<div class="record-row"><div><span class="swatch" style="display:inline-block;background:${x.color};margin-right:8px"></span><strong style="color:${withAlpha(x.color,.3+.7*v/100)}">${x.name}</strong><div class="small">${x.ko}</div></div><div class="progress-track"><div class="progress-bar" style="width:${v}%;background:${x.color}"></div></div><strong>${v}%</strong></div>`}).join('');const top=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,12);document.getElementById('mistakes').innerHTML=top.length?`<div class="tag-wrap">${top.map(([h,n])=>`<span class="tag miss">${plainHerb(h)} · ${n}회</span>`).join('')}</div>`:'<span class="small">아직 기록된 오답이 없습니다.</span>'}
document.getElementById('reset').onclick=()=>{if(confirm('암기 진행도와 퀴즈 기록을 모두 초기화할까요?')){Object.values(LS).forEach(k=>localStorage.removeItem(k));render()}};render();
</script></body></html>
